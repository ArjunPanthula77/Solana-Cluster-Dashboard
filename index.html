<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Coming Soon</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #000;
    }

    img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;      /* ✅ show full image */
      background-color: #000;   /* keeps background black around it */
      display: block;
    }
  </style>
</head>
<body>
  <img src="image.jpg" alt="Coming Soon" />
</body>
</html>
