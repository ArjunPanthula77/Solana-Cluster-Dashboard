<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coming Soon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;

    img {
      position: fixed;
      top: 0;

      height: 100vh;
      object-fit: cover;
      object-position: center center;
      display: block;
      background-color: #000;
    }
  </style>
</head>
<body>
  <img src="image.jpg" alt="Coming Soon" />
