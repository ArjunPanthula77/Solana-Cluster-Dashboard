<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Coming Soon</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #000;
    }

    img {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%);
      object-fit: cover;         /* fills the whole screen */
      object-position: center;   /* keeps the focus perfectly centered */
      display: block;
    }
  </style>
</head>
<body>
  <img src="Cominng Soon Opsonchain.jpg" alt="Coming Soon" />
</body>
</html>
